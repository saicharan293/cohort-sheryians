<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Project</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
        />
</head>
<body>
    <main>
        <!-- <nav></nav> -->
        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://images.unsplash.com/photo-1604782206219-3b9576575203?q=80&w=697&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h4>To Do List</h4>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzZ8fGJhY2tncm91bmR8ZW58MHx8MHx8fDA%3D" alt="">
                <h4>Daily Planner</h4>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/vector-1738399643589-0d4500d75b38?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8YmFja2dyb3VuZHxlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h4>Motivation</h4>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://plus.unsplash.com/premium_vector-1689096663443-79f4dff7498f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MjV8fGJhY2tncm91bmR8ZW58MHx8MHx8fDA%3D" alt="">
                <h4>Pomodoro Timer</h4>
            </div>
            <div class="goals elem" id="4">
                <img src="https://images.unsplash.com/photo-1579017308347-e53e0d2fc5e9?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
                <h4>Daily Goals</h4>
            </div>
        </section>
        <section class="fullElem">
            <button class="back">Close</button>
            <h1>Todo Page</h1>
        </section>
        <section class="fullElem">
            <button class="back">Close</button>
            <h1>Daily Planner</h1>
        </section>
        <section class="fullElem">
            <button class="back">Close</button>
            <h1>Motivational Quote</h1>
        </section>
        <section class="fullElem">
            <button class="back">Close</button>
            <h1>Pomodoro Timer</h1>
        </section>
        <section class="fullElem">
            <button class="back">Close</button>
            <h1>Daily Goals</h1>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
