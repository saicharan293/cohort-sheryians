<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
        rel="stylesheet"
    />
</head>
<body>

    <main>
        <section>
            <div class="all-reels">
                <div class="reel">
                    <img class="main-img" src="https://images.unsplash.com/photo-1564485377539-4af72d1f6a2f?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8bW9kZWx8ZW58MHx8MHx8fDA%3D" alt="">
                    <div class="bottom">
                        <div class="user">
                            <img src="https://images.unsplash.com/photo-1613505581027-8b10b1542a85?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1yZWxhdGVkfDV8fHxlbnwwfHx8fHw%3D" alt="">
                            <h4>Sai Charan</h4>
                            <button>Follow</button>
                        </div>
                        <h3>Lorem ipsum dolor sit amet.</h3>
                    </div>
                    <div class="right">
                        <div class="like">
                            <h4 class="like-icon icon"><i class="ri-heart-3-line"></i></h4>
                            <h6>200</h6>
                        </div>
                        
                        <div class="comment">
                            <h4 class="comment-icon icon"><i class="ri-chat-3-line"></i></h4>
                            <h6>66</h6>
                        </div>
                        
                        <div class="share">
                            <h4 class="share-icon icon"><i class="ri-share-forward-line"></i></h4>
                            <h6>66</h6>
                        </div>
                        
                        <div class="menu">
                            <h4 class="menu-icon icon"><i class="ri-more-2-fill"></i></h4>
                        </div>                        
                    </div>
                </div>
            </div>
        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
